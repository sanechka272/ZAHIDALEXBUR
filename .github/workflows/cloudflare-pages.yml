name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate Cloudflare credentials
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Missing CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID repository secret."
            exit 1
          fi

      - name: Install dependencies
        run: npm install

      - name: Test
        run: npm test

      - name: Build static export
        run: npm run build

      - name: Ensure Pages project exists
        run: npx --yes wrangler@latest pages project create zahidalexbur --production-branch=main || true

      - name: Deploy to Cloudflare Pages
        run: npx --yes wrangler@latest pages deploy out --project-name=zahidalexbur --branch=main --commit-hash=${{ github.sha }} --commit-message="${{ github.event.head_commit.message }}"
