name: One-shot lead E2E diagnostic

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/lead-e2e-debug.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for production edge
        run: sleep 10

      - name: POST a real test lead to production
        shell: bash
        run: |
          set -euo pipefail
          started_at_ms="$(( $(date +%s%3N) - 5000 ))"
          payload="$(printf '{"name":"E2E TEST — ignore","phone":"+380997837644","location":"TEST","service":"AUTOMATED TEST — ignore","originatingPage":"/__e2e-test","honeypot":"","startedAtMs":%s}' "$started_at_ms")"
          curl -sS -D /tmp/headers.txt -o /tmp/body.txt             -X POST 'https://zahidalexbur.com/api/leads'             -H 'content-type: application/json'             -H 'origin: https://zahidalexbur.com'             --data "$payload"
          echo '--- response headers ---'
          cat /tmp/headers.txt
          echo '--- response body ---'
          cat /tmp/body.txt
          status="$(awk 'toupper($1) ~ /^HTTP\// {code=$2} END {print code}' /tmp/headers.txt)"
          echo
          echo "HTTP_STATUS=$status"
          test "$status" = "201" -o "$status" = "202" -o "$status" = "200"
