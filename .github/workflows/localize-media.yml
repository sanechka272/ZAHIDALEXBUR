name: Localize premium media

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/localize-media.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  localize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download high-resolution licensed source photos
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/media

          curl -L --fail --retry 4 --retry-all-errors \
            'https://images.pexels.com/photos/21047659/pexels-photo-21047659.jpeg?cs=srgb&dl=pexels-rahul-bokhare-260663903-21047659.jpg&fm=jpg' \
            -o public/media/hero-waterwell.jpg

          curl -L --fail --retry 4 --retry-all-errors \
            'https://images.pexels.com/photos/4406602/pexels-photo-4406602.jpeg?cs=srgb&dl=pexels-eberhardgross-4406602.jpg&fm=jpg' \
            -o public/media/service-private-water.jpg

          curl -L --fail --retry 4 --retry-all-errors \
            'https://images.pexels.com/photos/15391048/pexels-photo-15391048.jpeg?cs=srgb&dl=pexels-ulrick-t-15391048.jpg&fm=jpg' \
            -o public/media/service-filter-drilling.jpg

          curl -L --fail --retry 4 --retry-all-errors \
            'https://images.pexels.com/photos/35224901/pexels-photo-35224901.jpeg?cs=srgb&dl=pexels-david-egah-2156618095-35224901.jpg&fm=jpg' \
            -o public/media/service-industrial-rig.jpg

          curl -L --fail --retry 4 --retry-all-errors \
            'https://images.pexels.com/photos/2793081/pexels-photo-2793081.jpeg?cs=srgb&dl=pexels-djordje-petrovic-590080-2793081.jpg&fm=jpg' \
            -o public/media/about-mountain-forest.jpg

      - name: Validate downloaded media
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          files = [
              Path('public/media/hero-waterwell.jpg'),
              Path('public/media/service-private-water.jpg'),
              Path('public/media/service-filter-drilling.jpg'),
              Path('public/media/service-industrial-rig.jpg'),
              Path('public/media/about-mountain-forest.jpg'),
          ]

          for path in files:
              data = path.read_bytes()
              if len(data) <= 100_000:
                  raise SystemExit(f'{path} is unexpectedly small: {len(data)} bytes')
              if data[:3] != b'\xff\xd8\xff':
                  raise SystemExit(f'{path} is not a valid JPEG')
              print(f'{path}: {len(data):,} bytes OK')
          PY

      - name: Commit localized media
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/media
          if git diff --cached --quiet; then
            echo 'Media already localized.'
            exit 0
          fi
          git commit -m 'assets: add high-resolution local photography'
          git push
